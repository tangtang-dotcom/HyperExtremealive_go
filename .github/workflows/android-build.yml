name: android-build
on:
  push:
    branches: [ 'ci/**', 'main' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK components
        run: |
          SDK="$ANDROID_SDK_ROOT"
          SDKM=$(ls -d "$SDK"/cmdline-tools/*/bin 2>/dev/null | head -1)
          echo "sdkmanager dir: $SDKM"
          export PATH="$SDKM:$SDK/platform-tools:$PATH"
          echo "sdk.dir=$SDK" > local.properties
          yes | sdkmanager --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$SDK" --install "platform-tools" "platforms;android-37.0" "platforms;android-37.2" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"
          echo '--- installed ---'
          ls "$SDK/platforms" "$SDK/build-tools" "$SDK/ndk" 2>/dev/null || true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
      - name: List outputs
        if: always()
        run: |
          echo '--- apk release ---'; ls -la app/build/outputs/apk/release/ 2>/dev/null || true
          echo '--- dynamic-wallpapers ---'; ls -la build/dynamic-wallpapers/ 2>/dev/null || true
      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HyperExtreme-ui36-apk
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/output-metadata.json
            build/dynamic-wallpapers/*.zip
